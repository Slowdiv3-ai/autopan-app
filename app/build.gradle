plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.autopan.app'
    compileSdk 34
    
    defaultConfig {
        applicationId "com.autopan.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "autopan123"
            keyAlias "autopan"
            keyPassword "autopan123"
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
